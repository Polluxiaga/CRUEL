project_name: my_vint
run_name: vint
# load_run: "my_vint/vint_2025_04_09_00_47_49"
# run_id: "28bzh5w3"

# training setup
gpu_id: 0
use_wandb: False # set to false if you don't want to log to wandb
wandb_log_freq: 220 # in iterations

# for obs_method: gaze or gazeplus or 1phase or 1phaseplus
# for act_method: vint or gazeaux or personaux or gazechannel or personchannel or gazetoken or persontoken
#                 gnm or gnmgazeaux or gnmpersonaux or gnmgazechannel or gnmpersonchannel
method: "persontoken" 
wg_origin: "GT" # GT or gaze or gazeplus or 2phase or 2phaseplus or 1phase or 1phaseplus

iftrain: True
ifgenerate: False
batch_size: 64

batch_size_obs_model: 128
batch_size_act_model: 64
act_lr: 1e-4
obs_lr: 1e-4
epochs: 200
num_workers: 8
optimizer: adamw
clipping: True
max_norm: 1.
scheduler: "cosine"
warmup: True  
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 1

# Early stopping parameters
early_stopping: true  # 是否启用早停
patience: 20        # 容忍多少个epoch测试损失没有改善
min_delta: 0.01    # 改善阈值

# 保存1phase_winner, 1phaseplus_winner, gaze_gen, gazeplus_gen, 2phase_winner, 2phaseplus_winner的路径
save_train_raw_path: "/home/yzc/CRUEL/data_splits/train"
save_test_raw_path: "/home/yzc/CRUEL/data_splits/test"

# 加载模型生成raw的路径
load_obs_model_path: "/home/yzc/CRUEL/data_splits/weights/best_gaze.pth"
load_act_model_path: "/home/yzc/CRUEL/data_splits/weights/best_gtact.pth"


# model params
model_type: vint
obs_encoder: "efficientnet-b0" # by default, this is imagenet pretrained
encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5

# action output params
len_traj_pred: 2

# dataset specific parameters
image_size: [160, 128] # width, height
obs_type: "image"
goal_type: "image"

datasets:
  debugdata:
    data_folder: /home/yzc/CRUEL/debugdata
    train: /home/yzc/CRUEL/debugdata_splits/train/
    test: /home/yzc/CRUEL/debugdata_splits/test/
    generated_labels_path: /home/yzc/CRUEL/debugdata_splits/

  data:
    data_folder: /home/yzc/CRUEL/data
    train: /home/yzc/CRUEL/data_splits/train/ #data_splits_folder
    test: /home/yzc/CRUEL/data_splits/test/ #data_splits_folder
    generated_labels_path: /home/yzc/CRUEL/data_splits/ #save generated_labels
    # data_folder: /Users/pollux/Documents/Robot_Navigation/CRUEL/data
    # train: /Users/pollux/Documents/Robot_Navigation/CRUEL/data_splits/train/ #data_splits_folder
    # test: /Users/pollux/Documents/Robot_Navigation/CRUEL/data_splits/test/ #data_splits_folder

# logging stuff
## =0 turns off
print_log_freq: 220 # in iterations
image_log_freq: 220 # in iterations
num_images_log: 3 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
eval_freq: 1 # in epochs